    get:
      summary: Serve an uploaded image (public access)
      operationId: getUploadedImage
      tags: [Uploads]
      security: []
      parameters:
        - in: path
          name: filename
          required: true
          schema:
            type: string
          description: Filename of the uploaded image
      responses:
        '200':
          description: Image file
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
            image/avif:
              schema:
                type: string
                format: binary
        '404':
          description: File not found
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

