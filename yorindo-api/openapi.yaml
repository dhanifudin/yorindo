  # ─────────────────────────────────────────────────────────────────────────────
  # UPLOADS
  # ─────────────────────────────────────────────────────────────────────────────
  /uploads:
    get:
      summary: List all uploaded images
      operationId: listUploads
      tags: [Uploads]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of uploaded image files
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      required: [filename, url, size, uploadedAt]
                      properties:
                        filename:
                          type: string
                          description: Original filename
                        url:
                          type: string
                          description: URL to access the uploaded file
                        size:
                          type: integer
                          description: File size in bytes
                        uploadedAt:
                          type: string
                          format: date-time
                          description: Upload timestamp
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /uploads/image:
    post:
      summary: Upload an image file (event banners, etc.)
      operationId: uploadImage
      tags: [Uploads]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file (JPEG, PNG, WebP, GIF, SVG, AVIF — max 5MB)
      responses:
        '201':
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    description: URL to access the uploaded image
                    example: /api/uploads/abc123.png
        '400':
          description: Validation error or unsupported file type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

