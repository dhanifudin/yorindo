            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  # ─────────────────────────────────────────────────────────────────────────────
  # SCAN
  # ─────────────────────────────────────────────────────────────────────────────
  /scan/verify:
    post:
      summary: Verify QR ticket and mark attendance (admin/staff)
      operationId: scanVerify
      tags: [Scan]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanVerifyBody'
      responses:
        '200':
          description: Scan result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResult'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Invalid or expired ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Insufficient role (admin/staff only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  # ─────────────────────────────────────────────────────────────────────────────
  # ETL
  # ─────────────────────────────────────────────────────────────────────────────
  /etl/upload:
    post:
      summary: Trigger ETL contact import job (admin only)
      operationId: triggerEtlUpload
      tags: [ETL]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: ETL job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncJobResponse'
        '400':
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Admin only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  # ─────────────────────────────────────────────────────────────────────────────
  # SMART FILTER
  # ─────────────────────────────────────────────────────────────────────────────
  /smart-filter/industry:
    post:
      summary: Map raw text to canonical industry slug via Claude Haiku (debounced)
      operationId: smartFilterIndustry
      tags: [SmartFilter]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmartFilterBody'
      responses:
        '200':
          description: Canonical industry slug and name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmartFilterResult'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  # ─────────────────────────────────────────────────────────────────────────────
  # USERS
  # ─────────────────────────────────────────────────────────────────────────────
  /users:
    get:
      summary: List all users (admin only)
      operationId: listUsers
      tags: [Users]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Paginated users list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Admin only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      summary: Create a new user (admin only)
      operationId: createUser
      tags: [Users]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserBody'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Admin only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /users/{id}/events:
    get:
      summary: Get events assigned to user (admin only)
      operationId: getUserEvents
      tags: [Users]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User's assigned events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Admin only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      summary: Assign event access to user (admin only)
      operationId: assignUserEvent
      tags: [Users]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId]
              properties:
                eventId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Event access assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEventAssignment'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Admin only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: User or event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Assignment already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /users/{id}/events/{eventId}:
    delete:
      summary: Revoke user's access to event (admin only)
      operationId: revokeUserEventAccess
      tags: [Users]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Access revoked
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Admin only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Assignment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

tags:
  - name: Health
    description: Service health check
  - name: Auth
    description: Authentication and token management
  - name: Contacts
    description: Contact database management and ETL
  - name: Events
    description: Event configuration and lifecycle management
  - name: Registrations
    description: Participant registration and approval workflow
  - name: Scan
    description: Event-day QR ticket verification
  - name: ETL
    description: Contact import job management
  - name: SmartFilter
    description: AI-powered industry filter
  - name: Blast
    description: Invitation blast and notifications
  - name: Analytics
    description: Event analytics and reporting
  - name: YoriMind
    description: AI-powered event analysis
  - name: Users
    description: User account and access management
