  # ─────────────────────────────────────────────────────────────────────────────
  /tickets/{token}:
    get:
      summary: Get ticket details by token (public — no auth required)
      operationId: getTicket
      description: Returns ticket details including QR payload for display to staff at check-in.
      tags: [Tickets]
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ticket details
          content:
            application/json:
              schema:
                type: object
                required: [token, participantName, eventName, eventDate, venue]
                properties:
                  token:
                    type: string
                  qrPayload:
                    type: string
                  participantName:
                    type: string
                  eventName:
                    type: string
                  eventDate:
                    type: string
                    format: date-time
                  venue:
                    type: string
        '404':
