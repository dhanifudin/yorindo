  # ─────────────────────────────────────────────────────────────────────────────
  # SCAN
  # ─────────────────────────────────────────────────────────────────────────────
  /scan/verify:
    post:
      summary: Verify QR ticket and mark attendance (admin/staff)
      operationId: scanVerify
      description: >
        Verifies the QR ticket token and marks the participant as attended.
        A `200` response is returned for successful or duplicate scans.
        Invalid or expired ticket tokens return `401` with `INVALID_TICKET`.
      tags: [Scan]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanVerifyBody'
      responses:
        '200':
          description: >
            Scan processed. Check `status` field: `success` = attendance marked,
            `already_attended` = duplicate scan, `invalid` = bad/expired ticket JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResult'
        '400':
          description: Validation error (missing token field)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
