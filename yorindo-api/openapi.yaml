      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [contactIds, eventLink]
                  properties:
                    contactIds:
                      type: array
                      items:
                        type: string
                        minLength: 1
                      description: Explicit list of contact IDs to blast
                    eventLink:
                      type: string
                      format: uri
                      description: Event landing page URL included in the blast
                - type: object
                  required: [segmentParams, eventLink, total]
                  properties:
                    segmentParams:
                      type: object
                      additionalProperties:
                        type: string
                      description: Filter parameters defining the target segment
                    eventLink:
                      type: string
                      format: uri
                      description: Event landing page URL included in the blast
                    total:
                      type: integer
                      minimum: 1
