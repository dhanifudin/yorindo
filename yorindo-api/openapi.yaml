openapi: 3.0.3
info:
  title: Yorindo API
  version: 1.0.0
  license:
    name: Proprietary
    url: https://yorindo.id/license
  description: |
    Yorindo event management platform API.

    All dates are ISO 8601 UTC strings (e.g., "2026-04-15T02:00:00.000Z").
    All IDs are opaque strings.
    All errors use { error: { code, message, details[] } } format exclusively.
    Rate limit: POST /api/registrations is limited to 10 requests/hour per IP.

servers:
  - url: http://localhost:3000/api
    description: Local development (via Docker Compose)
  - url: https://demo.dhanifudin.com/api
    description: Demo / deployed environment

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number (1-based)
    PageSizeParam:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 20
      description: Number of items per page
    SortByParam:
      name: sortBy
      in: query
      schema:
        type: string
      description: Field name to sort by
    SortDirParam:
      name: sortDir
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
      description: Sort direction

  schemas:
    # ─── Pagination ────────────────────────────────────────────────────────────
    Pagination:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 500
          example: 20
        total:
          type: integer
          example: 247
        totalPages:
          type: integer
          example: 13

    # ─── Error ─────────────────────────────────────────────────────────────────
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              description: SCREAMING_SNAKE_CASE error code
              example: VALIDATION_ERROR
            message:
              type: string
              description: Human-readable error description
              example: Validation failed
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: email
                  message:
                    type: string
                    example: Invalid email format

    # ─── Async Job ─────────────────────────────────────────────────────────────
    AsyncJobResponse:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
          example: etl-upload-001
        status:
          type: string
          enum: [queued]
          example: queued

    # ─── Lookup Tables ─────────────────────────────────────────────────────────
    Industry:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: string
          example: industry-001
        slug:
          type: string
          example: teknologi
        name:
          type: string
          example: Teknologi Informasi

    JobTitle:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: string
          example: job-title-001
        slug:
          type: string
          example: direktur
        name:
          type: string
          example: Direktur Utama

    # ─── Contact ───────────────────────────────────────────────────────────────
    Contact:
      type: object
      required: [id, name, completenessScore, consentStatus, createdAt, updatedAt]
      properties:
        id:
          type: string
          example: contact-001
        name:
          type: string
          example: Budi Santoso
        phone:
          type: string
          nullable: true
          example: "+6281234567890"
        email:
          type: string
          nullable: true
          example: budi@example.com
        serviceType:
          type: string
          nullable: true
          example: Konsultasi
          description: Raw service type from uploaded data
        jobTitle:
          type: string
          nullable: true
          example: Manajer
          description: Raw job title from uploaded data
        city:
          type: string
          nullable: true
          example: Jakarta
        company:
          type: string
          nullable: true
          example: PT Teknologi Maju
        department:
          type: string
          nullable: true
          example: Sales
        eventDate:
          type: string
          nullable: true
          example: '2026-03-31'
          description: Date of the event the contact attended
        source:
          type: string
          nullable: true
          enum: [excel_upload, form, manual, null]
        consentStatus:
          type: string
          enum: [active, suppressed, legacy_unverified]
          example: active
        flagCategory:
          type: string
          nullable: true
          enum: [invalid-data, duplicate, null]
        completenessScore:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.85
          description: Data quality score (0=incomplete, 1=complete)
        createdAt:
          type: string
          format: date-time
          example: "2026-03-19T10:30:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-03-19T10:30:00.000Z"

    PaginatedContacts:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Contact'
        pagination:
          $ref: '#/components/schemas/Pagination'

    FlaggedRecord:
      type: object
      required: [id, rawData, suggestedData, reason, status, createdAt]
      properties:
        id:
          type: string
        rawData:
          type: object
          additionalProperties: true
          description: Original unprocessed row from upload
        suggestedData:
          type: object
          additionalProperties: true
          description: GPT-4o normalized suggestion
        reason:
          type: string
          description: Why this record was flagged
        status:
          type: string
          enum: [pending, resolved, discarded]
        flags:
          type: array
          items:
            type: string
        uploadId:
          type: string
          nullable: true
        resolvedBy:
          type: string
          nullable: true
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    PaginatedFlaggedRecords:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FlaggedRecord'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ─── Event ─────────────────────────────────────────────────────────────────
    Event:
      type: object
      required: [id, name, slug, status, eventDate, timezone, createdAt, updatedAt]
      properties:
        id:
          type: string
          example: event-001
        name:
          type: string
          example: Seminar ERP Jakarta
        slug:
          type: string
          example: seminar-erp-jakarta
        description:
          type: string
          example: Seminar tentang implementasi ERP di industri manufaktur
        bannerUrl:
          type: string
          example: https://images.unsplash.com/photo-1540575467063?w=1200&h=675&fit=crop
          description: Event banner image URL
        status:
          type: string
          enum: [draft, published, active, completed, cancelled, archived]
          example: published
        eventDate:
          type: string
          format: date-time
          example: "2026-04-15T02:00:00.000Z"
        timezone:
          type: string
          enum: [Asia/Jakarta, Asia/Makassar, Asia/Jayapura]
          example: Asia/Jakarta
        capacity:
          type: integer
          minimum: 1
          example: 200
        registeredCount:
          type: integer
          minimum: 0
          example: 142
        targetCriteria:
          type: object
          additionalProperties: true
          description: Audience targeting criteria (JSONB)
        surveySchema:
          description: Survey template schema (JSONB)
        venue:
          type: string
          example: Jakarta Convention Center, Hall A
          description: Physical venue name and location
        industryTags:
          type: array
          items:
            type: string
          example: [teknologi, keuangan]
          description: Industry tags used for AI audience matching
        eventType:
          type: string
          enum: [conference, workshop, networking, seminar, webinar]
          example: conference
        topicTags:
          type: array
          items:
            type: string
          example: [fintech, digital-banking]
          description: Topic tags used for AI audience matching
        deletedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          example: "2026-03-19T10:30:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-03-19T10:30:00.000Z"
        postSurveyEnabled:
          type: boolean
          example: false
          description: Whether post-event survey is enabled

    CreateEventBody:
      type: object
      required: [name, eventDate, timezone]
      properties:
        name:
          type: string
          example: Seminar ERP Jakarta
        description:
          type: string
        eventDate:
          type: string
          format: date-time
        timezone:
          type: string
          enum: [Asia/Jakarta, Asia/Makassar, Asia/Jayapura]
        capacity:
          type: integer
          minimum: 1
        venue:
          type: string
          description: Physical venue name and location
        industryTags:
          type: array
          items:
            type: string
        eventType:
          type: string
          enum: [conference, workshop, networking, seminar, webinar]
        topicTags:
          type: array
          items:
            type: string
        targetCriteria:
          type: object
          additionalProperties: true

    UpdateEventBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        eventDate:
          type: string
          format: date-time
        timezone:
          type: string
          enum: [Asia/Jakarta, Asia/Makassar, Asia/Jayapura]
        capacity:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [draft, published, active, completed, cancelled, archived]
        targetCriteria:
          type: object
          additionalProperties: true
        postSurveyEnabled:
          type: boolean
          description: Toggle post-event survey enablement

    PaginatedEvents:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        pagination:
          $ref: '#/components/schemas/Pagination'

    AttendanceStats:
      type: object
      required: [total, attended, pending]
      properties:
        total:
          type: integer
          example: 180
        attended:
          type: integer
          example: 142
        pending:
          type: integer
          example: 38

    # ─── Registration ──────────────────────────────────────────────────────────
    Registration:
      type: object
      required: [id, contactId, eventId, status, surveyAnswers, createdAt]
      properties:
        id:
          type: string
          example: registration-001
        contactId:
          type: string
        eventId:
          type: string
        status:
          type: string
          enum: [pending, confirmed, approved, rejected, waitlisted, attended, cancelled]
          example: pending
        ticketToken:
          type: string
          nullable: true
          description: JWT ticket token; null until status is approved
          example: null
        surveyAnswers:
          type: object
          additionalProperties: true
        attendedAt:
          type: string
          format: date-time
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time
          example: "2026-03-19T10:30:00.000Z"

    RegistrationWithContact:
      allOf:
        - $ref: '#/components/schemas/Registration'
        - type: object
          required: [contactName, contactEmail, contactPhone, contactFlagCategory, aiScore, flagOverride]
          properties:
            contactName:
              type: string
              example: Budi Santoso
            contactCompany:
              type: string
              example: PT Maju Jaya
            contactEmail:
              type: string
              nullable: true
              example: budi@example.com
            contactPhone:
              type: string
              example: "+6281234567890"
            contactFlagCategory:
              type: string
              nullable: true
              enum: [invalid-data, duplicate, null]
              description: Inherited from contact record; null if no flag
            aiScore:
              type: integer
              minimum: 0
              maximum: 99
              description: Deterministic AI suitability score (djb2 hash of contactId+eventId)
              example: 85
            flagOverride:
              type: boolean
              description: When true, the inherited flag badge is suppressed for this registration without modifying the contact record
              example: false

    EventConfirmationRegistration:
      type: object
      required: [id, contact, channel, ticketSentAt, confirmationStatus]
      properties:
        id:
          type: string
        contact:
          type: object
          required: [name, company]
          properties:
            name:
              type: string
            company:
              type: string
        channel:
          type: string
          enum: [email, whatsapp]
        ticketSentAt:
          type: string
          format: date-time
          nullable: true
        confirmationStatus:
          type: string
          enum: [confirmed, pending]

    EventConfirmationResponse:
      type: object
      required: [stats, registrations]
      properties:
        stats:
          type: object
          required: [ticketSent, pendingConfirmation]
          properties:
            ticketSent:
              type: integer
              example: 180
            pendingConfirmation:
              type: integer
              example: 45
        registrations:
          type: array
          items:
            $ref: '#/components/schemas/EventConfirmationRegistration'

    TicketResendResponse:
      type: object
      required: [accepted, registrationId, channel, resentAt]
      properties:
        accepted:
          type: boolean
          enum: [true]
        registrationId:
          type: string
        channel:
          type: string
          enum: [email, whatsapp]
        resentAt:
          type: string
          format: date-time

    CreateRegistrationBody:
      type: object
      required: [eventId, name, email, phone]
      properties:
        eventId:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          example: "+6281234567890"
        surveyAnswers:
          type: object
          additionalProperties: true

    UpdateRegistrationStatusBody:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, confirmed, approved, rejected, waitlisted, attended, cancelled]

    PaginatedRegistrations:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RegistrationWithContact'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ─── Scan ──────────────────────────────────────────────────────────────────
    ScanVerifyBody:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: QR ticket JWT token

    ScanResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [success, already_attended, invalid]
          example: success
        registration:
          type: object
          properties:
            id:
              type: string
            contactName:
              type: string
              example: Budi Santoso
            eventName:
              type: string
              example: Seminar ERP Jakarta
        message:
          type: string
        attendedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the participant attended (set on successful scan)

    # ─── Check-in ──────────────────────────────────────────────────────────────
    CheckinStats:
      type: object
      required: [approved, attended, total]
      properties:
        approved:
          type: integer
          description: Registrations with status approved (not yet attended)
          example: 35
        attended:
          type: integer
          description: Registrations with status attended
          example: 28
        total:
          type: integer
          description: Total approved + attended (eligible attendees)
          example: 63

    # ─── Bulk operations ───────────────────────────────────────────────────────
    BulkFlagBody:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: string
          minItems: 1
          description: Contact IDs to flag
        flagCategory:
          type: string
          nullable: true
          enum: [spam, not-potential, invalid-data, duplicate]
          description: Flag to apply; null clears existing flag

    BulkFlagResult:
      type: object
      required: [updated]
      properties:
        updated:
          type: integer
          description: Number of contacts actually updated
          example: 5

    BulkApproveBody:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: string
          minItems: 1
          description: Registration IDs to approve

    BulkApproveResult:
      type: object
      required: [approved, total]
      properties:
        approved:
          type: integer
          description: Number of registrations successfully approved
          example: 8
        total:
          type: integer
          description: Total IDs submitted
          example: 8

    BulkRejectResult:
      type: object
      required: [rejected, total]
      properties:
        rejected:
          type: integer
          description: Number of registrations successfully rejected
          example: 5
        total:
          type: integer
          description: Total IDs submitted
          example: 5

    # ─── User ──────────────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, email, name, role, createdAt, updatedAt]
      properties:
        id:
          type: string
        email:
          type: string
          example: admin@yorindo.id
        name:
          type: string
          example: Admin Yorindo
        role:
          type: string
          enum: [admin, staff, viewer, participant]
          example: admin
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateUserBody:
      type: object
      required: [email, name, role, password]
      properties:
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin, staff, viewer, participant]
        password:
          type: string
          minLength: 8

    UpdateUserBody:
      type: object
      properties:
        name:
          type: string
          nullable: true
        role:
          type: string
          enum: [admin, staff, viewer, participant]

    PaginatedUsers:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          $ref: '#/components/schemas/Pagination'

    UserEventAssignment:
      type: object
      required: [id, userId, eventId, grantedAt]
      properties:
        id:
          type: string
        userId:
          type: string
        eventId:
          type: string
        grantedAt:
          type: string
          format: date-time

    # ─── Auth ──────────────────────────────────────────────────────────────────
    LoginBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: admin@yorindo.id
        password:
          type: string
          example: secret123

    AuthResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
          description: Short-lived JWT access token
        user:
          type: object
          required: [id, role]
          properties:
            id:
              type: string
            role:
              type: string
              enum: [admin, staff, viewer, participant]

    RefreshResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string
          description: Short-lived JWT access token

    # ─── Analytics ─────────────────────────────────────────────────────────────
    AnalyticsDashboard:
      type: object
      properties:
        funnelData:
          type: array
          items:
            type: object
            properties:
              stage:
                type: string
              count:
                type: integer
        industryBreakdown:
          type: array
          items:
            type: object
            properties:
              industry:
                type: string
              count:
                type: integer
        cityBreakdown:
          type: array
          items:
            type: object
            properties:
              city:
                type: string
              count:
                type: integer
        registrationTimeSeries:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              count:
                type: integer

    # ─── YoriMind ──────────────────────────────────────────────────────────────
    YoriMindResult:
      type: object
      required: [analysis, root_causes, recommendations, summary, tracked_metrics]
      properties:
        analysis:
          type: string
          description: Full AI-generated analysis text (Indonesian)
        root_causes:
          type: array
          items:
            type: string
        recommendations:
          type: array
          items:
            type: object
            required: [action, impact, priority]
            properties:
              action:
                type: string
              impact:
                type: string
              priority:
                type: string
                enum: [high, medium, low]
        summary:
          type: string
        tracked_metrics:
          type: array
          items:
            type: string

    # ─── Smart Filter ──────────────────────────────────────────────────────────
    SmartFilterBody:
      type: object
      required: [rawText]
      properties:
        rawText:
          type: string
          example: "teknologi informasi dan komunikasi"

    SmartFilterResult:
      $ref: '#/components/schemas/Industry'

    IndustryList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Industry'

    JobTitleList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/JobTitle'

    # ─── Blast ─────────────────────────────────────────────────────────────────
    BlastConfigBody:
      type: object
      required: [templateId, channel]
      description: >
        Blast configuration for sending event invitations.
        `filters` and `contactIds` are **mutually exclusive** — provide exactly one or neither
        (omitting both targets all non-flagged contacts matching the event's targetCriteria).
        Providing both will result in a 400 validation error.
      properties:
        templateId:
          type: string
        filters:
          type: object
          properties:
            industry:
              type: string
            city:
              type: string
            companySize:
              type: string
          description: "Manual audience filter criteria. Mutually exclusive with contactIds — omit when using contactIds."
        contactIds:
          type: array
          items:
            type: string
          description: "AI-curated contact list from audience recommendations. Mutually exclusive with filters — omit when using filters."
        scheduledAt:
          type: string
          format: date-time
          description: Optional scheduled delivery time (ISO 8601 UTC, must be >= now + 5 minutes); immediate if omitted
        channel:
          type: string
          enum: [email, whatsapp]
          default: email

    BlastJobResponse:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [queued, scheduled]
        scheduledAt:
          type: string
          format: date-time
          description: Present when status is 'scheduled'
        recipientCount:
          type: integer
          description: Number of contacts the blast will be sent to

    # ─── AI Audience Recommendations ────────────────────────────────────────────
    AudienceRecommendation:
      type: object
      required: [contactId, name, email, phone, industryId, city, companySize, score, factors]
      properties:
        contactId:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        industryId:
          type: string
        city:
          type: string
        companySize:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: Suitability score 0–100
        factors:
          type: array
          items:
            type: string
          example: ['industry:teknologi', 'location:jakarta']
        reliabilityRate:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Historical attendance rate (checked_in / registered)

    AudienceRecommendationsResponse:
      type: object
      required: [recommendations, totalMatched, totalExcluded, excludedReasons]
      properties:
        recommendations:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/AudienceRecommendation'
        totalMatched:
          type: integer
          description: Total eligible contacts (after exclusions)
        totalExcluded:
          type: integer
          description: Total contacts excluded due to flags
        excludedReasons:
          type: object
          additionalProperties:
            type: integer
          example: {not-potential: 5, spam: 3}

    RecommendedEvent:
      type: object
      required: [eventId, name, eventDate, status, score, factors]
      properties:
        eventId:
          type: string
        name:
          type: string
        eventDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [published, active]
        score:
          type: integer
          minimum: 0
          maximum: 100
        factors:
          type: array
          items:
            type: string

    RecommendedEventsResponse:
      type: object
      required: [recommendations, totalMatched]
      properties:
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/RecommendedEvent'
        totalMatched:
          type: integer

    # ─── Vendor ────────────────────────────────────────────────────────────────
    Vendor:
      type: object
      required: [id, name, contact_email, industry, linked_event_count, created_at, updated_at]
      properties:
        id:
          type: string
          example: vendor-001
        name:
          type: string
          example: Alibaba Cloud
        contact_email:
          type: string
          example: sponsor@alibabacloud.com
        industry:
          type: string
          example: teknologi
          description: Industry slug
        logo_url:
          type: string
          format: uri
          nullable: true
          example: null
        website:
          type: string
          format: uri
          nullable: true
          example: https://alibabacloud.com
        notes:
          type: string
          example: ""
        linked_event_count:
          type: integer
          example: 2
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateVendorBody:
      type: object
      required: [name, contact_email, industry]
      properties:
        name:
          type: string
        contact_email:
          type: string
        industry:
          type: string
        logo_url:
          type: string
          format: uri
          nullable: true
        website:
          type: string
          format: uri
          nullable: true
        notes:
          type: string

    UpdateVendorBody:
      type: object
      properties:
        name:
          type: string
        contact_email:
          type: string
        industry:
          type: string
        logo_url:
          type: string
          format: uri
          nullable: true
        website:
          type: string
          format: uri
          nullable: true
        notes:
          type: string

    PaginatedVendors:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Vendor'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ─── Sponsor ───────────────────────────────────────────────────────────────
    EventSponsor:
      type: object
      required: [id, event_id, vendor_id, vendor_name, tier, display_order]
      properties:
        id:
          type: string
        event_id:
          type: string
        vendor_id:
          type: string
        vendor_name:
          type: string
          example: Alibaba Cloud
        tier:
          type: string
          enum: [premium, standard, supporter]
          nullable: true
          example: premium
        display_order:
          type: integer
          example: 0

    AttachSponsorBody:
      type: object
      required: [vendorId]
      properties:
        vendorId:
          type: string
        tier:
          type: string
          enum: [premium, standard, supporter]
          nullable: true
        displayOrder:
          type: integer
          nullable: true

    UpdateSponsorBody:
      type: object
      properties:
        tier:
          type: string
          enum: [premium, standard, supporter]
          nullable: true
        display_order:
          type: integer
          nullable: true

    # ─── Template ──────────────────────────────────────────────────────────────
    Template:
      type: object
      required: [id, name, type, channel, body, createdAt]
      properties:
        id:
          type: string
          example: template-001
        name:
          type: string
          example: Undangan Event
        type:
          type: string
          enum: [invitation, confirmation, rejection, ticket_delivery, cancellation, reminder]
          example: invitation
        channel:
          type: string
          enum: [email, whatsapp]
          example: whatsapp
        body:
          type: string
          example: "Halo {{name}}, Anda diundang ke {{event_title}} pada {{date}} di {{venue}}.\n\nDaftar melalui: {{registration_link}}"
        variables:
          type: array
          items:
            type: string
          example: [name, event_title, date, venue, registration_link]
        createdAt:
          type: string
          format: date-time

    CreateTemplateBody:
      type: object
      required: [name, type, channel, body]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [invitation, confirmation, rejection, ticket_delivery, cancellation, reminder]
        channel:
          type: string
          enum: [email, whatsapp]
        body:
          type: string
        variables:
          type: array
          items:
            type: string

    # ─── Survey Schemas ────────────────────────────────────────────────────────
    SurveySchemaInput:
      type: object
      required: [schema]
      properties:
        schema:
          type: object
          required: [type, properties]
          additionalProperties: true
          properties:
            type:
              type: string
              enum: [object]
            properties:
              type: object
              additionalProperties: true
        uiSchema:
          type: object
          additionalProperties: true
          default: {}

    SurveySchemaResponse:
      type: object
      required: [schema, uiSchema]
      properties:
        schema:
          type: object
          additionalProperties: true
        uiSchema:
          type: object
          additionalProperties: true
        enabled:
          type: boolean
          description: Only present for post-event type

    SurveyResponseAggregate:
      type: object
      required: [questionId, questionLabel, fieldType]
      properties:
        questionId:
          type: string
        questionLabel:
          type: string
        fieldType:
          type: string
          enum: [text, textarea, radio, select, checkboxes, range, grid_radio, grid_checkbox, date, time, section]
        optionCounts:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              count:
                type: integer
              percentage:
                type: integer
        average:
          type: number
          description: For range questions
        distribution:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              count:
                type: integer
        totalCount:
          type: integer
          description: For text questions
        samples:
          type: array
          items:
            type: string
          description: Up to 3 sample responses for text questions

    SurveyResponseRecord:
      type: object
      required: [id, registrationId, contactName, contactPhone, submittedAt, answers]
      properties:
        id:
          type: string
        registrationId:
          type: string
        contactName:
          type: string
        contactPhone:
          type: string
        submittedAt:
          type: string
          format: date-time
        answers:
          type: object
          additionalProperties: true

    SurveyResponsesApiResponse:
      type: object
      required: [total, aggregates, responses, pagination]
      properties:
        total:
          type: integer
        aggregates:
          type: array
          items:
            $ref: '#/components/schemas/SurveyResponseAggregate'
        responses:
          type: array
          items:
            $ref: '#/components/schemas/SurveyResponseRecord'
        pagination:
          type: object
          properties:
            page:
              type: integer
            pageSize:
              type: integer
            totalPages:
              type: integer

    # ─── Contact Health & Facets ────────────────────────────────────────────────
    ContactHealth:
      type: object
      required: [flagged, duplicates, missingEmail, missingPhone]
      properties:
        flagged:
          type: integer
          example: 34
        duplicates:
          type: integer
          example: 12
        missingEmail:
          type: integer
          example: 58
        missingPhone:
          type: integer
          example: 21

    FacetItem:
      type: object
      required: [slug, label, count]
      properties:
        slug:
          type: string
          example: teknologi
        label:
          type: string
          example: Teknologi
        count:
          type: integer
          example: 42

    ContactFacets:
      type: object
      required: [serviceType, city]
      properties:
        serviceType:
          type: array
          items:
            $ref: '#/components/schemas/FacetItem'
        city:
          type: array
          items:
            $ref: '#/components/schemas/FacetItem'

    IndustrySuggestion:
      type: object
      required: [slug, label, confidence]
      properties:
        slug:
          type: string
          example: teknologi
        label:
          type: string
          example: Teknologi
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.85

    IndustrySuggestionsResponse:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/IndustrySuggestion'
        matchedSlug:
          type: string
          nullable: true
          example: teknologi
        fallback:
          type: boolean
          example: false

    # ─── Suppression ───────────────────────────────────────────────────────────
    SuppressionEntry:
      type: object
      required: [id, suppressedAt, reason]
      properties:
        id:
          type: string
          example: suppression-001
        name:
          type: string
          nullable: true
          example: Budi Santoso
        email:
          type: string
          nullable: true
          example: budi@example.com
        phone:
          type: string
          nullable: true
          example: "+6281234567890"
        suppressedAt:
          type: string
          format: date-time
        reason:
          type: string
          enum: [unsubscribed, erasure_request, manually_added]
          example: manually_added

    PaginatedSuppressions:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SuppressionEntry'
        pagination:
          $ref: '#/components/schemas/Pagination'

    AddSuppressionBody:
      type: object
      properties:
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        reason:
          type: string
          enum: [unsubscribed, erasure_request, manually_added]
          default: manually_added

    # ─── Duplicates ────────────────────────────────────────────────────────────
    DuplicatePair:
      type: object
      required: [id, primary, duplicate, matchScore, matchReasons]
      properties:
        id:
          type: string
          example: duplicate-group-001
        primary:
          $ref: '#/components/schemas/Contact'
        duplicate:
          $ref: '#/components/schemas/Contact'
        matchScore:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.92
        matchReasons:
          type: array
          items:
            type: string
          example: [same_phone, similar_name]

    PaginatedDuplicates:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DuplicatePair'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ─── Contact History ────────────────────────────────────────────────────────
    ContactHistoryEntry:
      type: object
      required: [eventId, eventName, eventDate, status]
      properties:
        eventId:
          type: string
        eventName:
          type: string
          example: Seminar ERP Jakarta
        eventDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, confirmed, approved, rejected, waitlisted, attended, cancelled]
          example: attended

    ContactHistoryResponse:
      type: object
      required: [registrations]
      properties:
        registrations:
          type: array
          items:
            $ref: '#/components/schemas/ContactHistoryEntry'

    # ─── Event Overview ─────────────────────────────────────────────────────────
    EventOverview:
      type: object
      required: [blastCount, registrationCount, approvedCount, attendedCount, pendingApprovals, seatsRemaining, daysUntilEvent]
      properties:
        blastCount:
          type: integer
          example: 2000
        registrationCount:
          type: integer
          example: 400
        approvedCount:
          type: integer
          example: 300
        attendedCount:
          type: integer
          example: 255
        lastBlastAt:
          type: string
          format: date-time
          nullable: true
        pendingApprovals:
          type: integer
          example: 100
        seatsRemaining:
          type: integer
          example: 0
        daysUntilEvent:
          type: integer
          example: 20

    # ─── Event Report ───────────────────────────────────────────────────────────
    EventReport:
      type: object
      required: [eventId, totalInvited, registered, approved, attended, attendanceRate, noShowRate, industryBreakdown, cityBreakdown, jobTitleBreakdown]
      properties:
        eventId:
          type: string
        totalInvited:
          type: integer
          example: 500
        registered:
          type: integer
          example: 180
        approved:
          type: integer
          example: 120
        attended:
          type: integer
          example: 95
        attendanceRate:
          type: string
          example: "79.2"
        noShowRate:
          type: string
          example: "20.8"
        industryBreakdown:
          type: array
          items:
            type: object
            properties:
              industry:
                type: string
              count:
                type: integer
        cityBreakdown:
          type: array
          items:
            type: object
            properties:
              city:
                type: string
              count:
                type: integer
        jobTitleBreakdown:
          type: array
          items:
            type: object
            properties:
              level:
                type: string
              count:
                type: integer

    # ─── Vendor Report ──────────────────────────────────────────────────────────
    VendorReport:
      type: object
      required: [token, eventName, dpaVersion, dpaAccepted]
      properties:
        token:
          type: string
          example: vendor-report-token-001
        eventName:
          type: string
          example: Seminar ERP Jakarta
        dpaVersion:
          type: string
          example: v2.1
        dpaAccepted:
          type: boolean
          example: false
        report:
          type: object
          nullable: true
          description: Full report data; null if DPA not yet accepted
          allOf:
            - $ref: '#/components/schemas/EventReport'

    VendorLinkResponse:
      type: object
      required: [sent, eventId, vendorId, contactEmail, expiresAt]
      properties:
        sent:
          type: boolean
          example: true
        eventId:
          type: string
        vendorId:
          type: string
        contactEmail:
          type: string
          example: sponsor@alibabacloud.com
        expiresAt:
          type: string
          format: date-time
          example: "2026-04-22T09:00:00.000Z"

    VendorDpaAcceptanceResponse:
      type: object
      required: [accepted, dpaVersion]
      properties:
        accepted:
          type: boolean
          example: true
        dpaVersion:
          type: string
          example: v2.1

    # ─── Participant ────────────────────────────────────────────────────────────
    ParticipantRegistration:
      type: object
      required: [id, eventId, eventName, eventDate, venue, status, ticketToken]
      properties:
        id:
          type: string
          example: participant-registration-001
        eventId:
          type: string
        eventName:
          type: string
          example: Seminar ERP Jakarta
        eventDate:
          type: string
          format: date-time
          example: "2026-04-15T09:00:00+07:00"
        venue:
          type: string
          example: Jakarta Convention Center
        status:
          type: string
          enum: [approved, pending, waitlisted, cancelled]
          example: approved
        ticketToken:
          type: string
          example: ticket-token-001

    # ─── Blast ─────────────────────────────────────────────────────────────────
    BlastHistoryItem:
      type: object
      required: [id, channel, recipientCount, sentAt, status]
      properties:
        id:
          type: string
          example: blast-history-001
        channel:
          type: string
          enum: [email, whatsapp]
        recipientCount:
          type: integer
          example: 312
        sentAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [queued, running, completed, failed, scheduled]
          example: completed

    StandaloneBlastBody:
      type: object
      required: [eventId, channel]
      description: >
        Send a blast for a specific event. Provide either `filters` for manual audience selection
        or `contactIds` for an AI-curated list — these are mutually exclusive.
        If neither is provided, the blast targets all non-flagged contacts matching the event's targetCriteria.
      properties:
        eventId:
          type: string
        channel:
          type: string
          enum: [email, whatsapp]
        templateId:
          type: string
          description: Template ID to use for the blast (mutually exclusive with customMessage).
        customMessage:
          type: string
          description: Custom text message for the blast (mutually exclusive with templateId).
        filters:
          type: object
          description: Manual audience filter criteria (mutually exclusive with contactIds)
          properties:
            industry:
              type: string
            city:
              type: string
            companySize:
              type: string
        contactIds:
          type: array
          items:
            type: string
          description: AI-curated contact list (mutually exclusive with filters)
        scheduledAt:
          type: string
          format: date-time
          description: Optional scheduled delivery time (ISO 8601 UTC, must be >= now + 5 minutes)

    EmergencyBlastBody:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Emergency message text
          example: "Perubahan lokasi acara — silakan cek aplikasi untuk detail terbaru."
        channels:
          type: array
          items:
            type: string
            enum: [email, whatsapp]
          description: Channels to send on; defaults to all approved channels
          example: [whatsapp, email]

    # ─── Upcoming Uncontacted ───────────────────────────────────────────────────
    UpcomingUncontactedResponse:
      type: object
      required: [event, daysUntil, uncontactedCount]
      properties:
        event:
          type: object
          nullable: true
          required: [id, name, eventDate]
          properties:
            id:
              type: string
            name:
              type: string
              example: Konferensi Teknologi 2026
            eventDate:
              type: string
              format: date-time
            industryTags:
              type: array
              items:
                type: string
        daysUntil:
          type: integer
          example: 8
        uncontactedCount:
          type: integer
          example: 45

    # ─── Audience Preview ──────────────────────────────────────────────────────
    AudiencePreviewResponse:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          example: 147

    # ─── Participants PWA Cache ─────────────────────────────────────────────────
    ParticipantCacheEntry:
      type: object
      required: [id, name, phone, ticketToken, status]
      properties:
        id:
          type: string
        name:
          type: string
          example: Budi Santoso
        phone:
          type: string
          example: "+6281234567890"
        ticketToken:
          type: string
          example: participant-cache-token-001
        status:
          type: string
          enum: [approved, attended]
          example: approved

    ParticipantCacheResponse:
      type: object
      required: [data, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantCacheEntry'
        total:
          type: integer
          example: 50

    # ─── Data Rights ───────────────────────────────────────────────────────────
    DataRightsResponse:
      type: object
      required: [message, requestId]
      properties:
        message:
          type: string
          example: Request queued
        requestId:
          type: string
          example: data-rights-request-001

    # ─── Settings ──────────────────────────────────────────────────────────────
    Setting:
      type: object
      required: [key, category]
      properties:
        id:
          type: string
        key:
          type: string
        value:
          type: string
          nullable: true
        category:
          type: string
        description:
          type: string
        is_secret:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

paths:
  # ─────────────────────────────────────────────────────────────────────────────
  # TEMPLATES
  # ─────────────────────────────────────────────────────────────────────────────
  /templates:
    get:
      summary: Get all templates
      operationId: getTemplates
      tags: [Blast]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Template'
    post:
      summary: Create template
      operationId: createTemplate
      tags: [Blast]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, channel, body]
              properties:
                name: { type: string }
                type: { type: string }
                channel: { type: string }
                body: { type: string }
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
  /templates/{id}:
    patch:
      summary: Update template
      operationId: updateTemplate
      tags: [Blast]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                type: { type: string }
                channel: { type: string }
                body: { type: string }
      responses:
        '200':
          description: Template updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
    put:
      summary: Update template (full replace)
      operationId: updateTemplatePut
      tags: [Blast]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                type: { type: string }
                channel: { type: string }
                body: { type: string }
      responses:
        '200':
          description: Template updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
    delete:
      summary: Delete template
      operationId: deleteTemplate
      tags: [Blast]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Template deleted

  # ─────────────────────────────────────────────────────────────────────────────
  # HEALTH
  # ─────────────────────────────────────────────────────────────────────────────
  /health:
    get:
      summary: Health check
      operationId: getHealth
      tags: [Health]
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  # ─────────────────────────────────────────────────────────────────────────────
  # AUTH
  # ─────────────────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      summary: Login with email and password
      operationId: login
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginBody'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/refresh:
    post:
      summary: Refresh access token using httpOnly refresh token cookie
      operationId: refreshToken
      tags: [Auth]
      security: []
      description: >
        The server reads the refresh token from the `refresh_token` httpOnly cookie set during login.
        No request body is required. The cookie is sent automatically by the browser on same-origin requests.
        The response sets a new `refresh_token` httpOnly cookie alongside the new access token.
      parameters:
        - name: Cookie
          in: header
          description: "httpOnly cookie containing the refresh token: `refresh_token=<jwt>`"
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          description: Invalid or expired refresh token cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/logout:
    post:
      summary: Logout and invalidate tokens
      operationId: logout
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Logged out successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  # ─────────────────────────────────────────────────────────────────────────────
  # CONTACTS
  # ─────────────────────────────────────────────────────────────────────────────
  /contacts:
    get:
      summary: List contacts with server-side pagination and filtering
      operationId: listContacts
      tags: [Contacts]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
