services:
  api:
    image: dhanifudin/yorindo-api:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      REPOSITORY_IMPL: memory
      SERVICE_IMPL: mock
      DATABASE_URL: postgresql://yorindo:${POSTGRES_PASSWORD}@postgres:5432/yorindo
      REDIS_URL: redis://redis:6379
      UPLOADS_DIR: /app/uploads
      SENTRY_DSN: ${API_SENTRY_DSN:-}
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  postgres:
    image: postgres:16-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_DB: yorindo
      POSTGRES_USER: yorindo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  api_uploads:
  postgres_data:
  redis_data:
