name: CI

on:
  pull_request:
    branches: ['**']
  workflow_dispatch:

# Cancel redundant runs — prevents double-fire when a push triggers both
# the push event and a pull_request event for the same commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - repo: yorindo-app
            lint: true
            openapi_lint: false
          - repo: yorindo-api
            lint: true
            openapi_lint: true
    steps:
      - uses: actions/checkout@v4

      - name: Check if repo has package.json
        id: pkg-check
        run: |
          if [ -f "package.json" ]; then
            echo "has_pkg=true" >> $GITHUB_OUTPUT
          else
            echo "has_pkg=false" >> $GITHUB_OUTPUT
            echo "⚠️  ${{ matrix.repo }} has no package.json — skipping lint/typecheck (scaffold not yet created)"
          fi
        working-directory: ${{ matrix.repo }}

      - uses: actions/setup-node@v4
        if: steps.pkg-check.outputs.has_pkg == 'true'
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.repo }}/package-lock.json'

      - name: Install dependencies
        if: steps.pkg-check.outputs.has_pkg == 'true'
        run: npm ci
        working-directory: ${{ matrix.repo }}

      - name: Lint
        if: steps.pkg-check.outputs.has_pkg == 'true' && matrix.lint
        run: npm run lint
        working-directory: ${{ matrix.repo }}

      - name: OpenAPI lint
        if: steps.pkg-check.outputs.has_pkg == 'true' && matrix.openapi_lint
        run: npm run openapi:lint
        working-directory: ${{ matrix.repo }}

      - name: Typecheck
        if: steps.pkg-check.outputs.has_pkg == 'true'
        run: npx tsc --noEmit
        working-directory: ${{ matrix.repo }}

  test:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: [yorindo-app, yorindo-api]
    steps:
      - uses: actions/checkout@v4

      - name: Check if repo has package.json
        id: pkg-check
        run: |
          if [ -f "package.json" ]; then
            echo "has_pkg=true" >> $GITHUB_OUTPUT
          else
            echo "has_pkg=false" >> $GITHUB_OUTPUT
            echo "⚠️  ${{ matrix.repo }} has no package.json — skipping tests (scaffold not yet created)"
          fi
        working-directory: ${{ matrix.repo }}

      - uses: actions/setup-node@v4
        if: steps.pkg-check.outputs.has_pkg == 'true'
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.repo }}/package-lock.json'

      - name: Install dependencies
        if: steps.pkg-check.outputs.has_pkg == 'true'
        run: npm ci
        working-directory: ${{ matrix.repo }}

      - name: Test
        if: steps.pkg-check.outputs.has_pkg == 'true'
        run: npm run test
        working-directory: ${{ matrix.repo }}
