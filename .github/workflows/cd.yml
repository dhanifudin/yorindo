name: CD

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  IMAGE_API: ${{ secrets.DOCKERHUB_USERNAME }}/yorindo-api
  IMAGE_APP: ${{ secrets.DOCKERHUB_USERNAME }}/yorindo-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "::error::CD must be triggered by a semver tag (e.g. v1.0.0), not a branch. Current ref: $GITHUB_REF"
            exit 1
          fi
          echo "value=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./yorindo-api
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE_API }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push App image
        uses: docker/build-push-action@v5
        with:
          context: ./yorindo-app
          push: true
          tags: |
            ${{ env.IMAGE_APP }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE_APP }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/yorindo
            docker compose pull
            docker compose up -d

      - name: Health check
        run: |
          sleep 15
          response=$(curl -s -o /dev/null -w "%{http_code}" https://demo.dhanifudin.com/api/health)
          if [ "$response" != "200" ]; then
            echo "Health check failed: HTTP $response"
            exit 1
          fi
          echo "Health check passed: HTTP $response"
