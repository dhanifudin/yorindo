name: CD

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  IMAGE_API: ${{ secrets.DOCKERHUB_USERNAME }}/yorindo-api
  IMAGE_APP: ${{ secrets.DOCKERHUB_USERNAME }}/yorindo-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag
        id: tag
        run: echo "value=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./yorindo-api
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE_API }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push App image
        uses: docker/build-push-action@v5
        with:
          context: ./yorindo-app
          push: true
          tags: |
            ${{ env.IMAGE_APP }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE_APP }}:latest
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.APP_SENTRY_DSN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deploy env file
        env:
          VPS_ENV_FILE: ${{ secrets.VPS_ENV_FILE }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          Path('.deploy.env').write_text(os.environ['VPS_ENV_FILE'], encoding='utf-8')
          PY
          echo "IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}" >> .deploy.env
      - name: Ensure VPS directories exist
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /var/www/yorindo/nginx
            chmod 755 /var/www/yorindo/nginx

      - name: Upload compose, Makefile and env files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.yml,Makefile,.deploy.env
          target: /var/www/yorindo

      - name: Upload nginx config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "nginx/nginx.conf,nginx/vps.conf"
          target: /var/www/yorindo

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            restore_previous_env() {
              if [ -f /var/www/yorindo/.env.previous ]; then
                cp /var/www/yorindo/.env.previous /var/www/yorindo/.env
              fi
            }

            test -s /var/www/yorindo/.deploy.env
            chmod 600 /var/www/yorindo/.deploy.env
            NGINX_PORT=$(grep -E '^NGINX_PORT=' /var/www/yorindo/.deploy.env 2>/dev/null | cut -d= -f2 || echo '8080')
            if ! grep -Rqs "127.0.0.1:${NGINX_PORT}" /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null; then
              echo "VPS nginx is not configured to proxy port ${NGINX_PORT}. Update the VPS nginx config before deploying."
              exit 1
            fi
            if [ -f /var/www/yorindo/.env ]; then
              cp /var/www/yorindo/.env /var/www/yorindo/.env.previous
            fi
            mv /var/www/yorindo/.deploy.env /var/www/yorindo/.env
            chmod 600 /var/www/yorindo/.env
            cd /var/www/yorindo
            if ! docker compose pull; then
              restore_previous_env
              exit 1
            fi
            if ! docker compose up -d; then
              restore_previous_env
              docker compose up -d
              exit 1
            fi

            sleep 15
            response=$(curl -s -o /dev/null -w "%{http_code}" https://demo.dhanifudin.com/api/health)
            if [ "$response" != "200" ]; then
              restore_previous_env
              docker compose up -d
              echo "Health check failed: HTTP $response"
              exit 1
            fi
            echo "Health check passed: HTTP $response"
