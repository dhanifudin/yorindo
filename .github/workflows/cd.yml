name: CD

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
    paths:
      - 'yorindo-api/**'
      - 'yorindo-app/**'
  workflow_dispatch:

env:
  IMAGE_API: ${{ secrets.DOCKERHUB_USERNAME }}/yorindo-api
  IMAGE_APP: ${{ secrets.DOCKERHUB_USERNAME }}/yorindo-app

# ─── DEMO (stable) — deployed on tag push ──────────────────────────────
jobs:
  build-and-push-demo:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag
        id: tag
        run: echo "value=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./yorindo-api
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE_API }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push App image
        uses: docker/build-push-action@v5
        with:
          context: ./yorindo-app
          push: true
          tags: |
            ${{ env.IMAGE_APP }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE_APP }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-demo:
    needs: build-and-push-demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deploy env file
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER || 'mock' }}
          MAILTRAP_HOST: ${{ secrets.MAILTRAP_HOST || '' }}
          MAILTRAP_PORT: ${{ secrets.MAILTRAP_PORT || '2525' }}
          MAILTRAP_USER: ${{ secrets.MAILTRAP_USER || '' }}
          MAILTRAP_PASS: ${{ secrets.MAILTRAP_PASS || '' }}
          WHATSAPP_PROVIDER: ${{ secrets.WHATSAPP_PROVIDER || 'mock' }}
          EVERPRO_API_KEY: ${{ secrets.EVERPRO_API_KEY || '' }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'disabled' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
        run: |
          printf '%s\n' \
            "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" \
            "JWT_SECRET=${JWT_SECRET}" \
            "JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}" \
            "IMAGE_TAG=${{ needs.build-and-push-demo.outputs.image_tag }}" \
            "REPOSITORY_IMPL=postgres" \
            "EMAIL_PROVIDER=${EMAIL_PROVIDER}" \
            "MAILTRAP_HOST=${MAILTRAP_HOST}" \
            "MAILTRAP_PORT=${MAILTRAP_PORT}" \
            "MAILTRAP_USER=${MAILTRAP_USER}" \
            "MAILTRAP_PASS=${MAILTRAP_PASS}" \
            "WHATSAPP_PROVIDER=${WHATSAPP_PROVIDER}" \
            "EVERPRO_API_KEY=${EVERPRO_API_KEY}" \
            "AI_PROVIDER=${AI_PROVIDER}" \
            "OPENAI_API_KEY=${OPENAI_API_KEY}" \
            "NEXT_PUBLIC_ENABLE_MOCKS=false" \
            "NEXT_PUBLIC_BASE_PATH=" \
            > .deploy.env

      - name: Upload compose and env files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,Makefile,.deploy.env"
          target: /var/www/emu

      - name: Upload nginx config to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "nginx/nginx.conf"
          target: /var/www/emu

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            DIR=/var/www/emu
            restore_previous() {
              [ -f $DIR/.env.previous ] && cp $DIR/.env.previous $DIR/.env
            }

            # Ensure nginx directory exists and move config to correct location
            mkdir -p $DIR/nginx
            [ -f $DIR/nginx.conf ] && mv $DIR/nginx.conf $DIR/nginx/nginx.conf

            test -s $DIR/.deploy.env
            chmod 600 $DIR/.deploy.env
            NGINX_PORT=8888
            if ! grep -Rqs "127.0.0.1:${NGINX_PORT}" /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null; then
              echo "VPS nginx not configured for port ${NGINX_PORT}."
              exit 1
            fi
            [ -f $DIR/.env ] && cp $DIR/.env $DIR/.env.previous
            mv $DIR/.deploy.env $DIR/.env
            chmod 600 $DIR/.env
            cd $DIR
            if ! docker compose down -v; then
              restore_previous
              exit 1
            fi
            if ! docker compose pull; then
              restore_previous
              exit 1
            fi
            docker compose up -d postgres redis
            until docker compose exec -T postgres pg_isready -U yorindo -d yorindo > /dev/null 2>&1; do sleep 1; done
            docker compose up -d api app nginx
            sleep 15

            docker compose exec -T -e ALLOW_SEED=true api npx tsx scripts/migrate.ts
            docker compose exec -T -e ALLOW_SEED=true api npx tsx scripts/seed.ts --demo

            response=$(curl -s -o /dev/null -w "%{http_code}" https://demo.dhanifudin.com/api/health)
            if [ "$response" != "200" ]; then
              restore_previous
              docker compose up -d
              echo "Health check failed: HTTP $response"
              exit 1
            fi
            echo "✅ Demo deployed — HTTP $response"

# ─── APP PREVIEW — deployed on main push ───────────────────────────────
  build-and-push-app:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag
        id: tag
        run: echo "value=preview-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build and push API preview image
        uses: docker/build-push-action@v5
        with:
          context: ./yorindo-api
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE_API }}:preview
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push App preview image
        uses: docker/build-push-action@v5
        with:
          context: ./yorindo-app
          push: true
          tags: |
            ${{ env.IMAGE_APP }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE_APP }}:preview
          build-args: |
            NEXT_PUBLIC_ENABLE_MOCKS=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-app:
    needs: build-and-push-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deploy env file
        run: |
          printf '%s\n' \
            "IMAGE_TAG=${{ needs.build-and-push-app.outputs.image_tag }}" \
            "NEXT_PUBLIC_ENABLE_MOCKS=false" \
            "NEXT_PUBLIC_BASE_PATH=" \
            > .deploy.env

      - name: Upload compose and env to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.app.yml,.deploy.env
          target: /var/www/emu-app

      - name: Deploy App Preview to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            DIR=/var/www/emu-app
            restore_previous() {
              [ -f $DIR/.env.previous ] && cp $DIR/.env.previous $DIR/.env
            }

            test -s $DIR/.deploy.env
            chmod 600 $DIR/.deploy.env
            NGINX_PORT=5173
            if ! grep -Rqs "127.0.0.1:${NGINX_PORT}" /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null; then
              echo "VPS nginx not configured for port ${NGINX_PORT}."
              exit 1
            fi
            [ -f $DIR/.env ] && cp $DIR/.env $DIR/.env.previous
            mv $DIR/.deploy.env $DIR/.env
            chmod 600 $DIR/.env
            cd $DIR
            if ! docker compose -f docker-compose.app.yml pull; then
              restore_previous
              exit 1
            fi
            docker compose -f docker-compose.app.yml up -d postgres redis
            sleep 5
            until docker compose -f docker-compose.app.yml exec -T postgres pg_isready -U yorindo -d yorindo > /dev/null 2>&1; do sleep 1; done
            docker compose -f docker-compose.app.yml up -d api app
            sleep 10

            # Migrate and seed preview
            docker compose -f docker-compose.app.yml exec -T -e ALLOW_SEED=true api npx tsx scripts/migrate.ts
            docker compose -f docker-compose.app.yml exec -T -e ALLOW_SEED=true api npx tsx scripts/seed.ts

            sleep 5
            response=$(curl -s -o /dev/null -w "%{http_code}" https://app.dhanifudin.com)
            if [ "$response" != "200" ]; then
              restore_previous
              docker compose -f docker-compose.app.yml up -d
              echo "Health check failed: HTTP $response"
              exit 1
            fi
            echo "✅ App preview deployed — HTTP $response"
