name: RepoSense Contribution Report

on:
  schedule:
    # 10:00 UTC = 17:00 WIB (Jakarta, UTC+7), Monday-Friday
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
    inputs:
      since_date:
        description: "Start date for report (YYYY-MM-DD). Leave empty for default."
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Java (required by RepoSense)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install octokit
        run: npm install octokit

      - name: Download RepoSense
        run: |
          REPOSENSE_VERSION="v4.0"
          wget "https://github.com/reposense/RepoSense/releases/download/${REPOSENSE_VERSION}/RepoSense.jar" \
            -O RepoSense.jar

      - name: Parse repository info
        id: repo-info
        run: |
          echo "owner=$(echo '${{ github.repository }}' | cut -d'/' -f1)" >> $GITHUB_OUTPUT
          echo "repo=$(echo '${{ github.repository }}' | cut -d'/' -f2)" >> $GITHUB_OUTPUT

      - name: Run RepoSense (code contributions)
        run: |
          SINCE_DATE=""
          if [ -n "${{ github.event.inputs.since_date }}" ]; then
            SINCE_DATE="--since ${{ github.event.inputs.since_date }}"
          fi
          java -jar RepoSense.jar \
            --config ${{ github.workspace }} \
            --output ${{ github.workspace }}/reposense-output/reposense \
            $SINCE_DATE \
            --view

      - name: Run GitHub API Report (issues, PRs, comments)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SINCE_DATE=""
          if [ -n "${{ github.event.inputs.since_date }}" ]; then
            SINCE_DATE="--since ${{ github.event.inputs.since_date }}"
          fi
          node scripts/contribution-report.mjs \
            --owner ${{ steps.repo-info.outputs.owner }} \
            --repo ${{ steps.repo-info.outputs.repo }} \
            --token ${{ secrets.GITHUB_TOKEN }} \
            --output ${{ github.workspace }}/reposense-output \
            $SINCE_DATE

      - name: Generate combined index
        run: |
          cp ${{ github.workspace }}/CNAME ${{ github.workspace }}/reposense-output/CNAME
          cat > ${{ github.workspace }}/reposense-output/index.html << 'INDEX'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Contribution Reports</title>
            <style>
              :root { --bg: #0d1117; --surface: #161b22; --border: #30363d; --text: #c9d1d9; --accent: #58a6ff; }
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
              .container { text-align: center; }
              h1 { margin-bottom: 2rem; font-size: 2rem; }
              .cards { display: flex; gap: 2rem; justify-content: center; flex-wrap: wrap; }
              .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 2rem 3rem; text-decoration: none; color: var(--text); transition: border-color 0.2s, transform 0.2s; min-width: 250px; }
              .card:hover { border-color: var(--accent); transform: translateY(-2px); }
              .card h2 { color: var(--accent); margin-bottom: 0.5rem; }
              .card p { color: var(--text-muted); font-size: 0.9rem; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>Contribution Reports</h1>
              <div class="cards">
                <a href="reposense/index.html" class="card">
                  <h2>Code Contributions</h2>
                  <p>RepoSense — commits, lines changed, files touched</p>
                </a>
                <a href="contribution-api/index.html" class="card">
                  <h2>GitHub Activity</h2>
                  <p>Issues, PRs, comments, and reviews</p>
                </a>
              </div>
            </div>
          </body>
          </html>
          INDEX

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ github.workspace }}/reposense-output
          publish_branch: gh-pages
          keep_files: true
          commit_message: "chore: update contribution report [${{ github.run_id }}]"
