server {
  listen 80;
  server_name _;

  # Use Docker's embedded DNS so upstream IPs are re-resolved after container restarts.
  # Without this, nginx caches IPs at startup and routes to stale containers when
  # docker compose up -d recreates services without restarting nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $upstream_api http://api:3000;
    proxy_pass $upstream_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
  }

  location / {
    set $upstream_app http://app:3000;
    proxy_pass $upstream_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
  }
}
