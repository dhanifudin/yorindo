# ============================================================
# VPS Nginx Template — demo.dhanifudin.com
# ============================================================
# This file is a REFERENCE TEMPLATE for the VPS-level nginx.
# The VPS nginx handles SSL termination and forwards all
# traffic to the Docker nginx container (NGINX_PORT in .env,
# default 8080).
#
# Setup steps:
#   1. Copy to /etc/nginx/sites-available/yorindo
#   2. Replace NGINX_PORT placeholder with the actual port
#      value from .env (e.g. 8080)
#   3. Obtain SSL certificates:
#        certbot --nginx -d demo.dhanifudin.com
#   4. Enable site:
#        ln -s /etc/nginx/sites-available/yorindo \
#               /etc/nginx/sites-enabled/yorindo
#   5. Test and reload:
#        nginx -t && systemctl reload nginx
# ============================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name demo.dhanifudin.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — SSL termination, proxy to Docker nginx
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name demo.dhanifudin.com;

    # SSL — managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/demo.dhanifudin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.dhanifudin.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Proxy to Docker nginx container
    # Replace NGINX_PORT with the value of NGINX_PORT in .env (default: 8080)
    location / {
        proxy_pass         http://127.0.0.1:NGINX_PORT;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_read_timeout 60s;
    }
}
