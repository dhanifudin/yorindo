# ============================================================
# VPS Nginx Template — EM . U
# ============================================================
# This file is a REFERENCE TEMPLATE for the VPS-level nginx.
# The VPS nginx handles SSL termination (Let's Encrypt) and
# forwards all traffic to the app container (port 5173 by
# default, or NGINX_PORT in .env for the demo stack).
#
# Prerequisites:
#   sudo apt install nginx certbot python3-certbot-nginx
#
# Setup steps:
#   1. Copy to /etc/nginx/sites-available/emu
#   2. Replace NGINX_PORT placeholder with the actual port
#      value from .env (e.g. 5173 for app, 8080 for demo)
#   3. Enable site before issuing cert (nginx must serve
#      /.well-known/acme-challenge/ on port 80 first):
#        ln -s /etc/nginx/sites-available/emu \
#               /etc/nginx/sites-enabled/emu
#        nginx -t && systemctl reload nginx
#   4. Issue Let's Encrypt certificate:
#        make ssl-init DOMAIN=your.domain.com EMAIL=admin@your.domain.com
#      OR manually:
#        certbot --nginx -d your.domain.com \
#          --non-interactive --agree-tos -m admin@your.domain.com
#   5. Set up auto-renewal (runs daily, renews if <30 days left):
#        echo "0 3 * * * root make -C /path/to/repo ssl-renew" \
#          | sudo tee /etc/cron.d/emu-certbot
# ============================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name demo.dhanifudin.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — SSL termination, proxy to Docker nginx
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name demo.dhanifudin.com;

    # SSL — managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/demo.dhanifudin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.dhanifudin.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Proxy to Docker nginx container
    # Replace NGINX_PORT with the value of NGINX_PORT in .env (default: 8080)
    location / {
        proxy_pass         http://127.0.0.1:NGINX_PORT;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_read_timeout 60s;
    }
}
