services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - app
    restart: unless-stopped

  api:
    image: ghcr.io/YOUR_ORG/yorindo-api:latest
    expose:
      - "3000"
    env_file: .env
    volumes:
      - snapshots_data:/data/snapshots
      - uploads_tmp:/tmp/uploads
    depends_on:
      - postgres
      - mongodb
      - redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  app:
    image: ghcr.io/YOUR_ORG/yorindo-app:latest
    expose:
      - "3000"
    env_file: .env
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_DB: yorindo
      POSTGRES_USER: yorindo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mongodb:
    image: mongo:7
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  snapshots_data:
  uploads_tmp:
