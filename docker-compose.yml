services:
  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - app
    restart: unless-stopped

  api:
    image: dhanifudin/yorindo-api:latest
    expose:
      - "3000"
    env_file: .env
    environment:
      # Phase 1: in-memory repositories — set to 'postgres' when BE is ready
      REPOSITORY_MODE: memory
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  app:
    image: dhanifudin/yorindo-app:latest
    expose:
      - "3000"
    env_file: .env
    environment:
      NEXT_PUBLIC_ENABLE_EXPERIMENTAL: ""
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_DB: yorindo
      POSTGRES_USER: yorindo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
