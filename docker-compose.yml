# Demo environment — demo.dhanifudin.com
# Pulls pre-built images from Docker Hub, fronted by nginx on port 8888.
#
# Usage:
#   make deploy-demo        (full deploy: down -v, pull, up, migrate, seed)
#   make reset-demo         (re-seed without full rebuild)
#   make stop-demo          (stop services, preserve data)
#   make logs-demo          (follow logs)
#
# VPS nginx reverse proxy (external, not in this stack):
#   demo.dhanifudin.com → localhost:8888 (nginx container)

services:
  nginx:
    container_name: yorindo-demo-nginx
    image: nginx:alpine
    ports:
      - "127.0.0.1:8888:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - app
    restart: unless-stopped

  postgres:
    container_name: yorindo-demo-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yorindo
      POSTGRES_USER: yorindo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yorindo -d yorindo"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    container_name: yorindo-demo-api
    image: dhanifudin/yorindo-api:${IMAGE_TAG:-latest}
    expose:
      - "3000"
    env_file: .env
    environment:
      REPOSITORY_IMPL: ${REPOSITORY_IMPL:-memory}
      SERVICE_IMPL: mock
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: yorindo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo123}
      POSTGRES_DB: yorindo
      REDIS_URL: redis://redis:6379
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mock}
      MAILTRAP_API_KEY: ${MAILTRAP_API_KEY:-}
      UPLOADS_DIR: /app/uploads
      SENTRY_DSN: ${API_SENTRY_DSN:-}
    volumes:
      - api_uploads:/app/uploads
      - api_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  app:
    container_name: yorindo-demo-app
    image: dhanifudin/yorindo-app:${IMAGE_TAG:-latest}
    expose:
      - "3000"
    env_file: .env
    environment:
      SENTRY_DSN: ${APP_SENTRY_DSN:-}
    depends_on:
      - api
    restart: unless-stopped

  redis:
    container_name: yorindo-demo-redis
    image: redis:7-alpine
    expose:
      - "6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  api_uploads:
  api_logs:
  postgres_data:
  redis_data:
