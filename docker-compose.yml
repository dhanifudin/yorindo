services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - app
    restart: unless-stopped

  api:
    image: dhanifudin/yorindo-api:latest
    expose:
      - "3000"
    env_file: .env
    environment:
      REPOSITORY_MODE: memory
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  app:
    image: dhanifudin/yorindo-app:latest
    expose:
      - "3000"
    env_file: .env
    environment:
      NEXT_PUBLIC_ENABLE_EXPERIMENTAL: ""
    restart: unless-stopped
