# EM · U — Demo environment (demo.dhanifudin.com)
# Full stack: nginx + api + app + postgres + redis
# Deployed on tag release (v*.*.*).
#
# Environment variables are read from the root .env file.
# Sysadmins can override any value by setting it in .env before deployment.
#
# Usage:
#   make deploy-demo        (full deploy: down -v, pull, up, migrate, seed)
#   make reset-demo         (re-seed without full rebuild)
#   make stop-demo          (stop services, preserve data)
#   make logs-demo          (follow logs)
#
# VPS nginx reverse proxy (external, not in this stack):
#   demo.dhanifudin.com → localhost:8888 (nginx container)

services:
  nginx:
    container_name: emu-demo-nginx
    image: nginx:alpine
    ports:
      - "127.0.0.1:8888:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - app
    restart: unless-stopped

  postgres:
    container_name: emu-demo-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yorindo
      POSTGRES_USER: yorindo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yorindo -d yorindo"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    container_name: emu-demo-api
    image: dhanifudin/yorindo-api:${IMAGE_TAG:-latest}
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      BASE_URL: https://demo.dhanifudin.com
      CORS_ORIGIN: https://demo.dhanifudin.com

      # Auth (from .env)
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}

      # Database
      REPOSITORY_IMPL: ${REPOSITORY_IMPL:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: yorindo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo123}
      POSTGRES_DB: yorindo
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}

      # Email (from .env)
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mock}
      MAILTRAP_HOST: ${MAILTRAP_HOST:-}
      MAILTRAP_PORT: ${MAILTRAP_PORT:-2525}
      MAILTRAP_USER: ${MAILTRAP_USER:-}
      MAILTRAP_PASS: ${MAILTRAP_PASS:-}

      # WhatsApp (from .env)
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-mock}
      EVERPRO_API_KEY: ${EVERPRO_API_KEY:-}

      # AI (from .env)
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - api_uploads:/app/uploads
      - api_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  app:
    container_name: emu-demo-app
    image: dhanifudin/yorindo-app:${IMAGE_TAG:-latest}
    expose:
      - "3000"
    environment:
      API_URL: http://api:3000
      NEXT_PUBLIC_ENABLE_MOCKS: "false"
    depends_on:
      - api
    restart: unless-stopped

  redis:
    container_name: emu-demo-redis
    image: redis:7-alpine
    expose:
      - "6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  api_uploads:
  api_logs:
  postgres_data:
  redis_data:
