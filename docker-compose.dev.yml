# Development override — use with:
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  api:
    build: ./yorindo-api
    command: npx tsx --watch --experimental-specifier-resolution=node src/main.ts
    volumes:
      - ./yorindo-api:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      # tsx watch uses legacyWatch for WSL2 filesystem compatibility
      TSX_LEGACY_WATCH: "true"
    ports:
      - "3000:3000"

  app:
    build: ./yorindo-app
    volumes:
      - ./yorindo-app:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development

  postgres:
    ports:
      - "5432:5432"

  mongodb:
    ports:
      - "27017:27017"

  redis:
    ports:
      - "6379:6379"
