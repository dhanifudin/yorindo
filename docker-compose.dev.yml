# Standalone dev environment — no pre-built images required
# Usage:
#   docker compose -f docker-compose.dev.yml up
#
# App: http://localhost:5173 (Next.js + MSW mocks)
# API: http://localhost:3000 (Fastify, hot-reload via tsx)
services:
  yorindo-api:
    container_name: yorindo-api-dev
    image: node:24
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    env_file: ./yorindo-api/.env
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: "postgresql://yorindo:${POSTGRES_PASSWORD:-yorindo}@yorindo-postgres-dev:5432/yorindo"
      REDIS_URL: "redis://yorindo-redis-dev:6379"
      ETL_AI_PROVIDER: "disabled"
      TSX_LEGACY_WATCH: "true" # required for WSL2 / Docker Desktop file watching
    volumes:
      - ./yorindo-api:/app
    ports:
      - "3000:3000"
    depends_on:
      - yorindo-postgres
      - yorindo-redis

  yorindo-app:
    container_name: yorindo-app-dev
    image: node:24
    working_dir: /app
    command: sh -c "PUPPETEER_SKIP_DOWNLOAD=true npm ci && npm run dev"
    env_file: ./yorindo-app/.env
    environment:
      NODE_ENV: development
      API_URL: "http://yorindo-api-dev:3000"
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true" # required for WSL2 / Docker Desktop file watching
    volumes:
      - ./yorindo-app:/app
    ports:
      - "5173:5173"
    depends_on:
      - yorindo-api

  yorindo-postgres:
    container_name: yorindo-postgres-dev
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yorindo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yorindo}
      POSTGRES_DB: yorindo
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  yorindo-redis:
    container_name: yorindo-redis-dev
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_dev_data:
