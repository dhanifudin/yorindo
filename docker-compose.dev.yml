# Standalone dev environment — no pre-built images required
# Usage:
#   docker compose -f docker-compose.dev.yml up
#
# App:  http://localhost:5173  (Next.js + MSW mocks)
# API:  http://localhost:3000  (Fastify, hot-reload via tsx)
#
# Override postgres password:
#   POSTGRES_PASSWORD=secret docker compose -f docker-compose.dev.yml up
#   — or set POSTGRES_PASSWORD in a .env file at the repo root

services:
  api:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    env_file: ./yorindo-api/.env
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: "postgresql://yorindo:${POSTGRES_PASSWORD:-yorindo}@postgres:5432/yorindo"
      REDIS_URL: "redis://redis:6379"
      ETL_AI_PROVIDER: "disabled"
      TSX_LEGACY_WATCH: "true"   # required for WSL2 / Docker Desktop file watching
    volumes:
      - ./yorindo-api:/app
      - api_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis

  app:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    env_file: ./yorindo-app/.env
    environment:
      NODE_ENV: development
      API_URL: "http://api:3000"
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"  # required for WSL2 / Docker Desktop file watching
    volumes:
      - ./yorindo-app:/app
      - app_node_modules:/app/node_modules
      - /app/.next
    ports:
      - "5173:5173"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yorindo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yorindo}
      POSTGRES_DB: yorindo
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  api_node_modules:
  app_node_modules:
  postgres_dev_data:
