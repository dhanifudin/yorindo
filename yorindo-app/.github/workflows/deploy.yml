name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: yorindo-app/package-lock.json

      - name: Install dependencies
        working-directory: yorindo-app
        run: npm ci

      # Determine basePath: /repo-name for project pages, empty for user/org pages (username.github.io)
      - name: Set base path
        id: basepath
        run: |
          REPO="${{ github.repository }}"
          REPO_NAME="${REPO#*/}"
          OWNER="${REPO%%/*}"
          # User/org pages repo (username.github.io) gets no basePath
          if [[ "$REPO_NAME" == "$OWNER.github.io" ]]; then
            echo "base_path=" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=/$REPO_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static export
        working-directory: yorindo-app
        env:
          NEXT_EXPORT: 'true'
          NEXT_PUBLIC_BASE_PATH: ${{ steps.basepath.outputs.base_path }}
        run: npm run build

      # GitHub Pages requires a .nojekyll file to serve files starting with _
      - name: Add .nojekyll
        run: touch yorindo-app/out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: yorindo-app/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
